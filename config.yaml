addr: ":8080"
ca_key: "./ca_key"
cert_validity: 8h

# Optional TLS configuration
# Uncomment to enable HTTPS
# tls:
#   cert: "./server.crt"
#   key: "./server.key"

client_id: "xxx.apps.googleusercontent.com"
client_secret: "xxx"
redirect_url: "http://localhost:8080/callback"

# Optional: externally reachable origin used to build device-flow links.
# Derived from redirect_url when unset, which is usually what you want.
# base_url: "https://ca.example.com"

# Optional: device authorization flow, for logging in on machines with no
# local browser (`vsh login --device`). Enabled by default; the whole block
# can be omitted.
# device_flow:
#   enabled: true          # set false to remove the /device endpoints
#   code_validity: 10m     # how long a code stays usable
#   poll_interval: 5s      # minimum spacing between client polls
#   max_pending: 1024      # cap on concurrent in-flight requests

# Optional: read-only web admin panel at /admin, showing recent server logs
# (certificate issuances, rejected tokens, config reloads). Access requires
# the ordinary Google login as one of the listed emails. Logs live in memory
# only: the panel shows the most recent lines and empties on restart.
# admin:
#   emails: [alice@example.com]
#   log_lines: 1000        # how many recent lines to keep (restart to change)

# Optional: machine (non-interactive) clients of POST /sign. Each service
# authenticates with a bearer token and receives a certificate for exactly
# the listed principals. The token is CA-signing capability for those
# principals — treat it like a private key, and never expose /sign to the
# internet. Unlike interactive logins, extensions default to EMPTY: add
# permit-pty explicitly if the client needs a terminal.
# services:
#   herdr-hq:
#     # exactly one of token_file / token_sha256:
#     token_file: /var/lib/voussh/tokens/herdr-hq   # token read (and trimmed) at request time
#     # token_sha256: "9f86d081..."                 # or: hex SHA-256 digest of the token
#     principals: [tlamadon]
#     validity: 12h                      # falls back to cert_validity
#     extensions: []                     # default empty; e.g. [permit-pty]
#     source_address: 100.88.151.28/32   # optional: CIDRs the cert may be used from

# Users: email -> role -> principals
users:
  alice@example.com:
    default: [root, admin]
    deploy: [deploy]
  bob@example.com:
    default: [developer]
    deploy: [deploy]
  charlie@example.com:
    default: [developer]
    admin: [root, admin]
    deploy: [deploy]
